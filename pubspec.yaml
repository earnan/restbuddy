name: restbuddy
description: RestBuddy - 多端休息提醒应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # 路由
  go_router: ^12.0.0

  # 本地数据库
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # 云端同步 - 坚果云 WebDAV
  webdav_client: ^1.2.2

  # 通知
  flutter_local_notifications: ^16.0.0

  # 音频
  audioplayers: ^5.0.0

  # 后台任务
  workmanager: ^0.5.0

  # 系统托盘
  tray_manager: ^0.2.0
  window_manager: ^0.3.0

  # 开机自启
  launch_at_startup: ^0.2.0

  # 图表
  fl_chart: ^0.65.0

  # 工具库
  path_provider: ^2.1.0
  csv: ^5.1.0
  share_plus: ^7.2.0
  permission_handler: ^11.0.0
  intl: ^0.18.0
  uuid: ^4.0.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^5.0.0

  # UI
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  isar_generator: ^3.1.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
